name: Staging

# Deploys main to GitHub Pages after CI passes on it, then runs an OWASP ZAP
# baseline scan against the live staging site (ADR-005, ADR-007).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Only deploy commits pushed to main in this repo that passed CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile only, no install scripts)
        run: npm ci

      - name: Build (normal build, no test hook)
        run: npm run build

      - name: Confirm the test hook is not in the build
        run: |
          if grep -rq __starDestroyer dist; then
            echo "::error::test hook found in the staging build"
            exit 1
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  zap:
    name: ZAP baseline scan
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Run ZAP 2.17.0 baseline (passive scan only)
        env:
          TARGET: ${{ needs.deploy.outputs.url }}
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 # 2.17.0
        run: |
          mkdir -p zap && chmod 777 zap
          # -I: warnings alone don't fail the run; scripts/zap_check.py decides.
          set +e
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$TARGET" -J report.json -r report.html -I
          rc=$?
          set -e
          # 0-2 = scan finished; 3 or more = ZAP itself failed.
          if [ "$rc" -ge 3 ]; then exit "$rc"; fi

      - name: Fail on high-risk findings
        run: python3 scripts/zap_check.py zap/report.json

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: zap/
          retention-days: 30
